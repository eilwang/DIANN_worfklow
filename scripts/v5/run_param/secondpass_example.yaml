# Example configuration for second pass search
# Copy and modify for your project

experiment:
  name: "FBML009"

paths:
  out_dir: "/path/to/output/directory"
  fasta: "/path/to/protein_database.fas"
  speclib: "/path/to/empirical_library.parquet"
  file_cfg: "/path/to/files.cfg"
  search_cfg: "/path/to/search_config.cfg"

options:
  search_mode: "secondpass"

slurm:
  threads: 32
  memory: "512G"
  time: "01-00:00:00"
